name: Quality Gate

on:
  pull_request:
  push:
    branches: [master, main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Full Quality Gate
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ui/zhontai.ui.admin.vue3/pnpm-lock.yaml
      - name: Start isolated Windows MySQL
        run: ./tools/ci-mysql.ps1 -Action Start
      - name: Restore backend
        run: dotnet restore src/ZhonTai.sln --disable-parallel
      - name: Install locked frontend dependencies
        working-directory: ui/zhontai.ui.admin.vue3
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run full quality gate
        shell: pwsh
        run: ./tools/run-quality-gate.ps1 -Mode Full -NoRestore
      - name: Audit high and critical dependencies
        run: ./tools/run-dependency-audit.ps1
      - name: Stop isolated Windows MySQL
        if: always()
        run: ./tools/ci-mysql.ps1 -Action Stop
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-evidence
          path: |
            artifacts/quality/
            ${{ runner.temp }}/admincore-ci-mysql/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified frontend build
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: ui/zhontai.ui.admin.vue3/dist/
          if-no-files-found: error
          retention-days: 7
